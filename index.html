<input id="product" placeholder="Enter product name" />
<button onclick="searchProduct()">Find Best Option</button>

<script>
function searchProduct() {
  const product = document.getElementById("product").value.trim();
  if (!product) {
    alert("Please enter a product name");
    return;
  }

  // ✅ Browser location API
  if (!navigator.geolocation) {
    // Fallback: no location
    sendRequest({ product });
    return;
  }

  navigator.geolocation.getCurrentPosition(
    (position) => {
      // ✅ Location auto-attached
      sendRequest({
        product: product,
        location: {
          lat: position.coords.latitude,
          lng: position.coords.longitude,
          accuracy: position.coords.accuracy
        }
      });
    },
    () => {
      // ✅ User denied permission → fallback safely
      sendRequest({ product });
    }
  );
}

function sendRequest(payload) {
  fetch("https://ai-shopping-backend-973u.onrender.com/compare", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  })
    .then(res => res.json())
    .then(data => console.log(data))
    .catch(err => console.error(err));
}
