<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Find Best Option</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    button {
      padding: 10px 16px;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #ddd;
      display: none;
    }

    .error {
      color: red;
    }
  </style>
</head>
<body>

  <h2>Find the Best Option Near You</h2>

  <input
    id="product"
    type="text"
    placeholder="Enter product name (e.g. iPhone 15)"
  />

  <button onclick="searchProduct()">Find Best Option</button>

  <div id="result"></div>

  <script>
    const BACKEND_URL = "https://YOUR-BACKEND.onrender.com/compare";

    function searchProduct() {
      const productInput = document.getElementById("product");
      const resultDiv = document.getElementById("result");

      resultDiv.style.display = "none";
      resultDiv.innerHTML = "";

      if (!productInput) {
        alert("Input field missing");
        return;
      }

      const product = productInput.value.trim();

      if (!product) {
        alert("Please enter a product name");
        return;
      }

      // Try to get browser location automatically
      if (!navigator.geolocation) {
        // Location not supported → fallback
        sendRequest({ product });
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          // ✅ Location obtained automatically
          sendRequest({
            product: product,
            location: {
              lat: position.coords.latitude,
              lng: position.coords.longitude,
              accuracy: position.coords.accuracy
            }
          });
        },
        () => {
          // ❌ User denied permission → fallback without location
          sendRequest({ product });
        }
      );
    }

    function sendRequest(payload) {
      console.log("Sending payload:", payload);

      fetch(BACKEND_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
        .then(response => {
          if (!response.ok) {
            throw new Error("Backend error " + response.status);
          }
          return response.json();
        })
        .then(data => {
          displayResult(data);
        })
        .catch(err => {
          showError(err.message);
        });
    }

    function displayResult(data) {
      const resultDiv = document.getElementById("result");

      resultDiv.style.display = "block";

      resultDiv.innerHTML = `
        <h3>Recommendation</h3>
        <p><strong>Product:</strong> ${data.product || "-"}</p>
        <p><strong>Status:</strong> ${data.status || "-"}</p>
        <p><strong>Decision:</strong> ${data.decision || "-"}</p>
        <p><strong>Confidence:</strong> ${data.confidence || "-"}</p>

        ${
          data.ai_advice && data.ai_advice.reasoning
            ? `<p><strong>Why?</strong></p>
               <ul>
                 ${data.ai_advice.reasoning.map(r => `<li>${r}</li>`).join("")}
               </ul>`
            : ""
        }
      `;
    }

    function showError(msg) {
      const resultDiv = document.getElementById("result");

      resultDiv.style.display = "block";
      resultDiv.innerHTML = `<p class="error">Error: ${msg}</p>`;
    }
  </script>

</body>
</html>
