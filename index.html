<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>AI Buy Advisor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
    }
    input {
      width: 70%;
      padding: 8px;
    }
    button {
      padding: 8px 12px;
    }
    .result {
      margin-top: 20px;
      white-space: pre-wrap;
      background: #f5f5f5;
      padding: 10px;
    }
  </style>
</head>

<body>

  <h2>AI Buy Advisor</h2>

  <p>Enter a product to see live prices and get BUY / WAIT advice.</p>

  <input id="product" placeholder="e.g. iPhone 15" />
  <button onclick="compare()">Compare</button>

  <div id="status"></div>
  <div id="result" class="result"></div>

  <script>
    async function compare() {
      const product = document.getElementById("product").value;
      document.getElementById("status").textContent = "Checking prices...";
      document.getElementById("result").textContent = "";

      try {
        const response = await fetch(
          "https://ai-shopping-backend.onrender.com/compare",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ product })
          }
        );

        const data = await response.json();
        document.getElementById("status").textContent = "";
        document.getElementById("result").textContent =
          JSON.stringify(data, null, 2);

      } catch (err) {
        document.getElementById("status").textContent = "Error contacting backend.";
      }
    }
  </script>

</body>
